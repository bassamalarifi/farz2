<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>فرز — منصة بسام لإدارة التوظيف</title>
<style>
/* ============================================================
   فرز — Farz Recruitment Platform
   Light/dark theme via CSS custom properties (validated palette)
   ============================================================ */
:root{
  color-scheme: light;
  --bg:#f9f9f7; --surface:#fcfcfb; --surface-2:#f3f2ee;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,.10);
  --accent:#2a78d6; --accent-ink:#1c5cab; --accent-soft:rgba(42,120,214,.09);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s-other:#a5a49d;
  --good:#0ca30c; --good-text:#006300; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --ord1:#86b6ef; --ord2:#5598e7; --ord3:#2a78d6; --ord4:#1c5cab; --ord5:#0d366b;
  --shadow:0 1px 2px rgba(11,11,11,.04), 0 4px 16px rgba(11,11,11,.05);
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --bg:#0d0d0d; --surface:#1a1a19; --surface-2:#232322;
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
    --accent:#3987e5; --accent-ink:#86b6ef; --accent-soft:rgba(57,135,229,.14);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s-other:#6d6c66;
    --good:#0ca30c; --good-text:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
    --ord1:#b7d3f6; --ord2:#86b6ef; --ord3:#5598e7; --ord4:#256abf; --ord5:#184f95;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0d0d0d; --surface:#1a1a19; --surface-2:#232322;
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
  --accent:#3987e5; --accent-ink:#86b6ef; --accent-soft:rgba(57,135,229,.14);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s-other:#6d6c66;
  --good:#0ca30c; --good-text:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --ord1:#b7d3f6; --ord2:#86b6ef; --ord3:#5598e7; --ord4:#256abf; --ord5:#184f95;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit; cursor:pointer}
input,select{font-family:inherit}

/* ---------- Layout ---------- */
.app{display:flex; min-height:100vh}
.sidebar{
  width:225px; flex-shrink:0; background:var(--surface);
  border-inline-start:none; border-inline-end:1px solid var(--border);
  padding:16px 12px; position:sticky; top:0; height:100vh; overflow-y:auto;
  display:flex; flex-direction:column; gap:2px;
}
.brand{display:flex; align-items:center; gap:10px; padding:6px 8px 16px}
.brand-logo{
  width:38px; height:38px; border-radius:10px; background:var(--accent);
  color:#fff; display:flex; align-items:center; justify-content:center;
  font-size:19px; font-weight:800; flex-shrink:0;
}
.brand-name{font-size:17px; font-weight:800; letter-spacing:-.2px}
.brand-sub{font-size:10.5px; color:var(--muted); margin-top:-3px}
.nav-label{font-size:10.5px; color:var(--muted); padding:12px 10px 4px; font-weight:700}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:9px;
  color:var(--ink-2); background:none; border:none; width:100%; text-align:start;
  font-size:13.5px; transition:background .12s;
}
.nav-item svg{width:17px; height:17px; flex-shrink:0; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.nav-item:hover{background:var(--surface-2)}
.nav-item.active{background:var(--accent-soft); color:var(--accent-ink); font-weight:700}
.nav-count{
  margin-inline-start:auto; font-size:11px; background:var(--surface-2);
  color:var(--muted); border-radius:20px; padding:0 7px; min-width:20px; text-align:center;
  font-variant-numeric:tabular-nums;
}
.nav-item.active .nav-count{background:var(--accent); color:#fff}
.sidebar-foot{margin-top:auto; padding:12px 8px 4px; border-top:1px solid var(--border)}
.user-chip{display:flex; align-items:center; gap:9px}
.user-avatar{
  width:32px; height:32px; border-radius:50%; background:var(--accent-soft);
  color:var(--accent-ink); font-weight:800; font-size:13px;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.user-name{font-size:12.5px; font-weight:700}
.user-role{font-size:10.5px; color:var(--muted)}

.main{flex:1; min-width:0; display:flex; flex-direction:column}
.topbar{
  display:flex; align-items:center; gap:10px; padding:12px 20px;
  border-bottom:1px solid var(--border); background:var(--surface);
  position:sticky; top:0; z-index:40;
}
.page-title{font-size:16px; font-weight:800; margin-inline-end:auto}
.chip{
  display:inline-flex; align-items:center; gap:6px; font-size:11.5px;
  border:1px solid var(--border); border-radius:20px; padding:3px 10px;
  color:var(--ink-2); background:var(--surface); white-space:nowrap;
}
.dot{width:7px; height:7px; border-radius:50%; flex-shrink:0}
.dot.off{background:var(--muted)} .dot.on{background:var(--good)} .dot.wait{background:var(--warn)}
.icon-btn{
  width:32px; height:32px; border-radius:9px; border:1px solid var(--border);
  background:var(--surface); color:var(--ink-2); display:flex; align-items:center;
  justify-content:center; font-size:15px;
}
.icon-btn:hover{background:var(--surface-2)}
.content{padding:20px; max-width:1200px; width:100%; margin:0 auto}

/* ---------- Cards & general ---------- */
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
  box-shadow:var(--shadow); padding:16px;
}
.card-title{font-size:13px; font-weight:800; margin-bottom:12px; display:flex; align-items:center; gap:8px}
.card-title .hint{font-weight:400; font-size:11px; color:var(--muted); margin-inline-start:auto}
.grid{display:grid; gap:14px}
.grid-2{grid-template-columns:1fr 1fr}
@media (max-width:860px){ .grid-2{grid-template-columns:1fr} }
.section-gap{margin-bottom:14px}

/* ---------- Demo banner ---------- */
.banner{
  display:flex; align-items:center; gap:10px; background:var(--accent-soft);
  border:1px solid var(--border); border-radius:var(--r); padding:10px 14px;
  font-size:12.5px; color:var(--ink-2); margin-bottom:14px;
}
.banner b{color:var(--accent-ink)}
.banner .close{margin-inline-start:auto; background:none; border:none; color:var(--muted); font-size:16px; padding:2px 6px}

/* ---------- Stat tiles ---------- */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:14px}
.stat{background:var(--surface); border:1px solid var(--border); border-radius:var(--r); box-shadow:var(--shadow); padding:14px 16px}
.stat-label{font-size:11.5px; color:var(--muted); margin-bottom:4px}
.stat-value{font-size:26px; font-weight:700; line-height:1.15}
.stat-delta{font-size:11px; margin-top:3px; color:var(--muted)}
.stat-delta.up{color:var(--good-text); font-weight:700}

/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto}
table{width:100%; border-collapse:collapse; font-size:13px}
th{
  text-align:start; font-size:11px; color:var(--muted); font-weight:700;
  padding:8px 10px; border-bottom:1px solid var(--grid); white-space:nowrap;
}
td{padding:9px 10px; border-bottom:1px solid var(--grid); white-space:nowrap; vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer; transition:background .1s}
tbody tr:hover{background:var(--surface-2)}
.td-name{font-weight:700}
.td-sub{font-size:11px; color:var(--muted); font-weight:400}
.num{font-variant-numeric:tabular-nums}

/* ---------- Badges ---------- */
.badge{
  display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700;
  border-radius:20px; padding:2px 9px; white-space:nowrap;
}
.badge .dot{width:6px; height:6px}
.b-stage1{background:var(--accent-soft); color:var(--accent-ink)}
.b-neutral{background:var(--surface-2); color:var(--ink-2)}
.b-good{background:rgba(12,163,12,.12); color:var(--good-text)}
.b-crit{background:rgba(208,59,59,.12); color:var(--crit)}
.b-warn{background:rgba(250,178,25,.15); color:var(--ink-2)}
.stars{color:var(--warn); font-size:12px; letter-spacing:1px; white-space:nowrap}
.stars .off{color:var(--grid)}
.src-tag{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ink-2)}
.src-tag .sq{width:8px; height:8px; border-radius:2px; flex-shrink:0}

/* ---------- Toolbar / filters ---------- */
.toolbar{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px}
.search{
  flex:1; min-width:180px; display:flex; align-items:center; gap:8px;
  background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:7px 12px;
}
.search input{border:none; outline:none; background:none; color:var(--ink); width:100%; font-size:13px}
.search svg{width:15px; height:15px; stroke:var(--muted); fill:none; stroke-width:2; stroke-linecap:round; flex-shrink:0}
.select{
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:7px 10px; font-size:12.5px; color:var(--ink-2); outline:none; max-width:170px;
}
.result-count{font-size:11.5px; color:var(--muted); margin-top:10px}

/* ---------- Candidate cards ---------- */
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px}
.cand-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
  box-shadow:var(--shadow); padding:14px; cursor:pointer; transition:border-color .12s;
}
.cand-card:hover{border-color:var(--accent)}
.cand-head{display:flex; align-items:center; gap:10px; margin-bottom:9px}
.cand-avatar{
  width:36px; height:36px; border-radius:50%; flex-shrink:0;
  background:var(--accent-soft); color:var(--accent-ink);
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px;
}
.cand-name{font-weight:800; font-size:13.5px}
.cand-title{font-size:11.5px; color:var(--muted)}
.cand-meta{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.cand-foot{display:flex; align-items:center; justify-content:space-between; margin-top:10px; padding-top:9px; border-top:1px solid var(--grid)}

/* ---------- Kanban ---------- */
.kanban{display:flex; gap:12px; overflow-x:auto; padding-bottom:8px}
.kcol{min-width:200px; width:200px; flex-shrink:0}
.kcol-head{
  display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:800;
  padding:8px 10px; background:var(--surface); border:1px solid var(--border);
  border-radius:10px; margin-bottom:8px;
}
.kcol-count{margin-inline-start:auto; font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums}
.kcard{
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:10px 12px; margin-bottom:8px; cursor:pointer; box-shadow:var(--shadow);
}
.kcard:hover{border-color:var(--accent)}
.kcard-name{font-weight:700; font-size:12.5px}
.kcard-sub{font-size:11px; color:var(--muted); margin-top:2px}
.kempty{font-size:11.5px; color:var(--muted); text-align:center; padding:14px 8px; border:1px dashed var(--grid); border-radius:10px}

/* ---------- Tasks ---------- */
.task-day{font-size:11.5px; font-weight:800; color:var(--muted); margin:14px 0 8px}
.task-day:first-child{margin-top:0}
.task-row{
  display:flex; align-items:center; gap:12px; background:var(--surface);
  border:1px solid var(--border); border-radius:10px; padding:10px 14px; margin-bottom:8px;
}
.task-check{
  width:19px; height:19px; border-radius:6px; border:1.5px solid var(--baseline);
  background:none; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  color:transparent; font-size:12px;
}
.task-row.done .task-check{background:var(--good); border-color:var(--good); color:#fff}
.task-row.done .task-title{text-decoration:line-through; color:var(--muted)}
.task-title{font-weight:700; font-size:13px}
.task-sub{font-size:11px; color:var(--muted)}
.task-time{margin-inline-start:auto; font-size:12px; color:var(--ink-2); font-variant-numeric:tabular-nums; white-space:nowrap}

/* ---------- Charts (div-based bars) ---------- */
.bar-row{display:flex; align-items:center; gap:10px; min-height:26px}
.bar-label{width:110px; flex-shrink:0; font-size:11.5px; color:var(--ink-2); text-align:start; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bar-track{flex:1; display:flex; align-items:center; gap:7px}
.bar-fill{height:16px; border-radius:0 4px 4px 0; min-width:3px; transition:width .3s}
[dir="rtl"] .bar-fill{border-radius:4px 0 0 4px}
.bar-val{font-size:11.5px; color:var(--ink-2); font-variant-numeric:tabular-nums}
.stack{display:flex; gap:2px; height:18px; border-radius:5px; overflow:hidden; margin:6px 0 12px}
.stack-seg{height:100%; min-width:4px}
.legend{display:flex; flex-wrap:wrap; gap:12px; font-size:11.5px; color:var(--ink-2)}
.legend .key{display:flex; align-items:center; gap:6px}
.legend .sw{width:9px; height:9px; border-radius:2.5px; flex-shrink:0}
.legend b{font-variant-numeric:tabular-nums}
.chart-note{font-size:10.5px; color:var(--muted); margin-top:10px}

/* ---------- Empty states ---------- */
.empty{
  text-align:center; padding:36px 20px; color:var(--muted);
  border:1.5px dashed var(--grid); border-radius:var(--r); font-size:13px;
}
.empty .big{font-size:26px; margin-bottom:8px}
.empty b{color:var(--ink-2)}

/* ---------- Settings ---------- */
.conn-card{display:flex; align-items:flex-start; gap:12px; padding:14px 0; border-bottom:1px solid var(--grid)}
.conn-card:last-child{border-bottom:none}
.conn-icon{
  width:38px; height:38px; border-radius:10px; background:var(--surface-2);
  display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0;
}
.conn-name{font-weight:800; font-size:13px}
.conn-desc{font-size:11.5px; color:var(--muted); margin-top:2px; line-height:1.55}
.cmd{
  display:block; width:100%; text-align:start; background:var(--surface-2); border:1px solid var(--border);
  border-radius:9px; padding:8px 12px; font-size:12.5px; color:var(--ink-2); margin-bottom:7px;
}
.cmd:hover{border-color:var(--accent); color:var(--accent-ink)}
.cmd b{color:var(--accent-ink)}

/* ---------- Modal ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:100;
  display:none; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto;
}
.overlay.open{display:flex}
.modal{
  background:var(--surface); border:1px solid var(--border); border-radius:16px;
  width:100%; max-width:520px; padding:22px; box-shadow:0 20px 60px rgba(0,0,0,.3);
}
.modal-head{display:flex; align-items:center; gap:12px; margin-bottom:14px}
.modal-close{margin-inline-start:auto; background:none; border:none; font-size:20px; color:var(--muted); padding:4px 8px}
.detail-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; margin:14px 0}
@media (max-width:480px){ .detail-grid{grid-template-columns:1fr} }
.detail-item .dl{font-size:10.5px; color:var(--muted)}
.detail-item .dv{font-size:13px; font-weight:600; word-break:break-word}
.timeline{display:flex; align-items:center; gap:0; margin:16px 0 6px}
.tl-step{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; position:relative}
.tl-dot{width:13px; height:13px; border-radius:50%; background:var(--grid); border:2px solid var(--surface); z-index:2}
.tl-step.on .tl-dot{background:var(--accent)}
.tl-step.cur .tl-dot{box-shadow:0 0 0 3px var(--accent-soft)}
.tl-line{position:absolute; top:6px; inset-inline-start:-50%; width:100%; height:2px; background:var(--grid); z-index:1}
.tl-step.on .tl-line{background:var(--accent)}
.tl-step:first-child .tl-line{display:none}
.tl-name{font-size:9.5px; color:var(--muted); text-align:center}
.tl-step.cur .tl-name{color:var(--accent-ink); font-weight:800}
.modal-note{
  background:var(--accent-soft); border-radius:10px; padding:10px 13px;
  font-size:11.5px; color:var(--ink-2); margin-top:14px; line-height:1.6;
}
.notes-box{background:var(--surface-2); border-radius:10px; padding:10px 13px; font-size:12.5px; color:var(--ink-2); line-height:1.7}

/* ---------- Tooltip ---------- */
#tooltip{
  position:fixed; z-index:200; background:var(--ink); color:var(--bg);
  font-size:11.5px; padding:6px 10px; border-radius:8px; pointer-events:none;
  display:none; max-width:220px; box-shadow:0 4px 14px rgba(0,0,0,.25);
}
#tooltip b{font-variant-numeric:tabular-nums}

/* ---------- Responsive: narrow panel ---------- */
@media (max-width:820px){
  .app{flex-direction:column}
  .sidebar{
    width:100%; height:auto; position:static; flex-direction:row; align-items:center;
    overflow-x:auto; padding:8px 10px; gap:4px; border-inline-end:none;
    border-bottom:1px solid var(--border);
  }
  .brand{padding:0 4px; margin-inline-end:6px}
  .brand-sub, .nav-label, .sidebar-foot{display:none}
  .nav-item{width:auto; white-space:nowrap; padding:7px 11px; font-size:12.5px}
  .nav-item svg{width:15px; height:15px}
  .content{padding:14px}
  .topbar{padding:10px 14px; flex-wrap:wrap}
}
::-webkit-scrollbar{height:8px; width:8px}
::-webkit-scrollbar-thumb{background:var(--baseline); border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- بوابة الدخول ---------- */
body.locked .app{display:none}
#gate{position:fixed; inset:0; background:var(--bg); z-index:500; display:flex; align-items:center; justify-content:center; padding:20px}
body:not(.locked) #gate{display:none}
.gate-card{background:var(--surface); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow); padding:36px 30px; width:100%; max-width:360px; text-align:center}
.gate-logo{width:64px; height:64px; border-radius:16px; background:var(--accent); color:#fff; font-size:27px; font-weight:800; display:flex; align-items:center; justify-content:center; margin:0 auto 14px}
.gate-title{font-size:19px; font-weight:800}
.gate-sub{font-size:12px; color:var(--muted); margin:4px 0 20px}
.gate-input{width:100%; padding:11px 14px; border:1.5px solid var(--border); border-radius:11px; background:var(--bg); color:var(--ink); font-size:15px; text-align:center; direction:ltr; outline:none; letter-spacing:1px}
.gate-input:focus{border-color:var(--accent)}
.gate-btn{width:100%; margin-top:12px; padding:11px; border:none; border-radius:11px; background:var(--accent); color:#fff; font-size:14px; font-weight:800}
.gate-btn:disabled{opacity:.6}
.gate-err{color:var(--crit); font-size:12px; min-height:18px; margin-top:10px; font-weight:700}
.gate-note{font-size:10.5px; color:var(--muted); margin-top:16px; line-height:1.7}

</style>
</head>
<body class="locked">
<div id="gate"><div class="gate-card">
  <div class="gate-logo">فرز</div>
  <div class="gate-title">منصة فرز</div>
  <div class="gate-sub">إدارة التوظيف — بسام العريفي · دخول الإدارة</div>
  <input class="gate-input" id="gatePass" type="password" placeholder="كلمة المرور" autocomplete="current-password">
  <button class="gate-btn" id="gateBtn">دخول</button>
  <div class="gate-err" id="gateErr"></div>
  <div class="gate-note">🔐 هذه المنصة خاصة — بيانات المتقدمين مشفرة (AES-256) ولا يمكن قراءتها بدون كلمة المرور.</div>
</div></div>

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar" id="topbar"></div>
    <div class="content" id="view"></div>
  </div>
</div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div id="tooltip"></div>

<script>
/* ============================================================
   فرز — منطق الواجهة
   ============================================================ */
const $ = s => document.querySelector(s);
const TODAY = new Date();
const MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const DAYS = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];

function esc(s){ return String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function parseD(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function fmtDate(s){ if(!s) return "—"; const d = parseD(s); return d.getDate() + " " + MONTHS[d.getMonth()]; }
function fmtDateFull(s){ if(!s) return "—"; const d = parseD(s); return DAYS[d.getDay()] + " " + d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear(); }
function relDate(s){
  const d = parseD(s), t = new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate());
  const diff = Math.round((t - d) / 86400000);
  if(diff <= 0 && diff > -1) return "اليوم";
  if(diff === 1) return "أمس";
  if(diff > 1 && diff <= 14) return "قبل " + diff + " أيام";
  return fmtDate(s);
}
function initials(name){ const p = name.trim().split(/\s+/); return (p[0]?.[0] || "") + (p[1]?.[0] || ""); }
function stars(n){
  let h = "";
  for(let i=1; i<=5; i++) h += `<span class="${i<=n ? "" : "off"}">★</span>`;
  return `<span class="stars" title="التقييم ${n} من 5">${h}</span>`;
}
const SRC_COLORS = {"Gmail":"var(--s1)","ملفات الجهاز":"var(--s2)","الموقع القديم":"var(--s3)","إدخال يدوي":"var(--s-other)"};
function srcTag(src){ return `<span class="src-tag"><span class="sq" style="background:${SRC_COLORS[src] || "var(--s-other)"}"></span>${esc(src)}</span>`; }
function stageBadge(c){
  if(c.rejected) return `<span class="badge b-crit">✕ مرفوض</span>`;
  if(c.stage === "تعيين") return `<span class="badge b-good">✓ تعيين</span>`;

  return `<span class="badge b-stage1">${esc(c.stage)}</span>`;
}

function weekCount(){
  const t = new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate());
  return DB.candidates.filter(c => (t - parseD(c.date)) / 86400000 <= 7).length;
}

  openVac: () => DB.vacancies.filter(v => v.status === "مفتوح").length,
  upcoming: () => DB.tasks.filter(t => !t.done && parseD(t.date) >= new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate())).length
};

  $("#themeBtn").onclick = toggleTheme;
}
let themeMode = "auto";
function toggleTheme(){
  themeMode = themeMode === "auto" ? "dark" : themeMode === "dark" ? "light" : "auto";
  const root = document.documentElement;
  if(themeMode === "auto") root.removeAttribute("data-theme");
  else root.setAttribute("data-theme", themeMode);
}

function go(id){
  CURRENT = id;
  renderSidebar();
  renderTopbar();
  $("#view").innerHTML = VIEWS[id].render();
  bindView();
  $(".main").scrollTop = 0;
  window.scrollTo(0,0);
}

}
function statTile(label, value, delta, deltaUp){
  return `<div class="stat"><div class="stat-label">${label}</div><div class="stat-value">${value}</div>${delta ? `<div class="stat-delta ${deltaUp ? "up" : ""}">${delta}</div>` : ""}</div>`;
}
function funnelBars(){
  const counts = DB.stages.map(s => activeCands().filter(c => c.stage === s).length);
  const max = Math.max(...counts, 1);
  const ords = ["var(--ord1)","var(--ord2)","var(--ord3)","var(--ord4)","var(--ord5)"];
  let h = "";
  DB.stages.forEach((s, i) => {
    const pct = Math.max(counts[i] / max * 100, 2);
    h += `<div class="bar-row" data-tip="مرحلة ${esc(s)}: ${counts[i]} مرشح">
      <div class="bar-label">${esc(s)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${ords[i]}"></div><span class="bar-val">${counts[i]}</span></div>
    </div>`;
  });
  const rej = DB.candidates.filter(c => c.rejected).length;
  h += `<div class="chart-note">✕ مرفوض: <b>${rej}</b> — خارج المسار، محفوظ في بنك السير.</div>`;
  return h;
}

      const shown = specCounts.slice(0, 8);
      const rest = specCounts.slice(8).reduce((a,x) => a + x.n, 0);
      if(rest > 0) shown.push({ s: "أخرى (مجمّعة)", n: rest });
      const maxN = Math.max(...shown.map(x => x.n), 1);
      const specBars = shown.map(x => `
        <div class="bar-row" data-tip="${esc(x.s)}: ${x.n} من ${DB.candidates.length} سيرة">
          <div class="bar-label" title="${esc(x.s)}">${esc(x.s)}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.max(x.n / maxN * 100, 2)}%; background:var(--s1)"></div><span class="bar-val">${x.n}</span></div>
        </div>`).join("");

      /* مصدر السير — جزء من كل: شريط مكدّس + مفتاح بالأرقام */
      const srcCounts = DB.sources.map(s => ({ s, n: DB.candidates.filter(c => c.source === s).length })).filter(x => x.n > 0);
      const totalSrc = srcCounts.reduce((a,x) => a + x.n, 0) || 1;
      const stack = srcCounts.map(x => `<div class="stack-seg" data-tip="${esc(x.s)}: ${x.n} (${Math.round(x.n / totalSrc * 100)}%)" style="flex:${x.n}; background:${SRC_COLORS[x.s]}"></div>`).join("");
      const legend = srcCounts.map(x => `<span class="key"><span class="sw" style="background:${SRC_COLORS[x.s]}"></span>${esc(x.s)} <b>${x.n}</b> (${Math.round(x.n / totalSrc * 100)}%)</span>`).join("");

      /* جدول تفصيلي — النسخة الجدولية لكل الرسوم */
      const tblRows = specCounts.map(x => `<tr><td>${esc(x.s)}</td><td class="num">${x.n}</td><td class="num">${Math.round(x.n / DB.candidates.length * 100)}%</td></tr>`).join("");

      return `${demoBanner()}
      <div class="kpis">
        ${statTile("إجمالي السير", KPI.total())}
        ${statTile("نسبة الترشيح", Math.round(KPI.shortlisted() / Math.max(KPI.total(),1) * 100) + "%")}
        ${statTile("تم تعيينهم", DB.candidates.filter(c => c.stage === "تعيين" && !c.rejected).length)}
        ${statTile("نسبة الرفض", Math.round(DB.candidates.filter(c => c.rejected).length / Math.max(KPI.total(),1) * 100) + "%")}
      </div>
      <div class="grid grid-2 section-gap">
        <div class="card"><div class="card-title">توزيع التخصصات <span class="hint">أعلى ٨ + المجمّع</span></div>${specBars}</div>
        <div class="card">
          <div class="card-title">مصدر السير الذاتية <span class="hint">جزء من الكل</span></div>
          <div class="stack">${stack}</div>
          <div class="legend">${legend}</div>
          <div style="margin-top:18px" class="card-title">مسار التوظيف</div>
          ${funnelBars()}
        </div>
      </div>
      <div class="card">
        <div class="card-title">تفصيل التخصصات — عرض جدولي</div>
        <div class="tbl-wrap"><table>
          <thead><tr><th>التخصص</th><th>عدد السير</th><th>النسبة</th></tr></thead>
          <tbody>${tblRows}</tbody>
        </table></div>
      </div>
      <div class="result-count">تبي تقرير جاهز للإرسال؟ قل لي: «اطلع لي تقرير أسبوعي PDF» أو «صدّر بنك السير Excel»</div>`;
    }
  },

    render(){
      if(!DB.trash.length) return `${demoBanner()}<div class="empty"><div class="big">🗑</div><b>السلة فاضية</b></div>`;
      return `${demoBanner()}
      <div class="card" style="padding:6px 10px"><div class="tbl-wrap"><table>

/* ---------- الفلترة ---------- */
function filterCands(){
  return DB.candidates.filter(c => {
    if(filters.q){
      const q = filters.q.trim();
      const hay = [c.name, c.title, c.specialty, c.city, c.notes, c.email, c.source].join(" ");
      if(!hay.includes(q)) return false;
    }
    if(filters.specialty && c.specialty !== filters.specialty) return false;
    if(filters.source && c.source !== filters.source) return false;
    if(filters.stage === "مرفوض"){ if(!c.rejected) return false; }
    else if(filters.stage){ if(c.rejected || c.stage !== filters.stage) return false; }
    return true;
  }).sort((a,b) => b.date.localeCompare(a.date));
}

/* ---------- ربط الأحداث بعد كل عرض ---------- */
function bindView(){
  document.querySelectorAll("[data-cand]").forEach(el => el.onclick = () => openModal(el.dataset.cand));
  document.querySelectorAll("[data-close-banner]").forEach(el => el.onclick = e => { e.stopPropagation(); bannerHidden = true; go(CURRENT); });
  document.querySelectorAll("[data-task]").forEach(el => el.onclick = () => {
    const t = DB.tasks.find(t => t.id === el.dataset.task);
    if(t){ t.done = !t.done; go(CURRENT); }
  });
  document.querySelectorAll("[data-copy]").forEach(el => el.onclick = () => {
    const txt = el.dataset.copy;
    try{ navigator.clipboard.writeText(txt); el.style.borderColor = "var(--good)"; setTimeout(() => el.style.borderColor = "", 900); }catch(e){}
  });
  const q = $("#q");
  if(q){
    q.oninput = () => { filters.q = q.value; refreshTableOnly(); };
    const fS = $("#fSpec"), fR = $("#fSrc"), fG = $("#fStage");
    fS.onchange = () => { filters.specialty = fS.value; go(CURRENT); };
    fR.onchange = () => { filters.source = fR.value; go(CURRENT); };
    fG.onchange = () => { filters.stage = fG.value; go(CURRENT); };
  }
}
function refreshTableOnly(){
  /* إعادة رسم مع الحفاظ على تركيز البحث */
  const pos = $("#q").selectionStart;
  go(CURRENT);
  const q = $("#q");
  if(q){ q.focus(); q.setSelectionRange(pos, pos); }
}

/* ---------- نافذة تفاصيل المرشح ---------- */
function openModal(id){
  const c = DB.candidates.find(x => x.id === id);
  if(!c) return;
  const curIdx = DB.stages.indexOf(c.stage);
  const timeline = c.rejected
    ? `<div class="modal-note" style="background:rgba(208,59,59,.1); color:var(--crit)">✕ هذا المرشح مرفوض — محفوظ في بنك السير لفرص مستقبلية. للاسترجاع قل: «رجّع ${esc(c.name)} للمسار»</div>`
    : `<div class="timeline">${DB.stages.map((s, i) => `
        <div class="tl-step ${i <= curIdx ? "on" : ""} ${i === curIdx ? "cur" : ""}">
          <div class="tl-line"></div><div class="tl-dot"></div><div class="tl-name">${s}</div>
        </div>`).join("")}</div>`;
  $("#modal").innerHTML = `
    <div class="modal-head">
      <div class="cand-avatar" style="width:44px; height:44px; font-size:16px">${esc(initials(c.name))}</div>
      <div>

      <button class="modal-close" id="mClose">✕</button>

    <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center">
      <span class="badge b-neutral">${esc(c.specialty)}</span>
      ${stageBadge(c)}
      ${stars(c.rating)}
    </div>
    ${timeline}
    <div class="detail-grid">
      <div class="detail-item"><div class="dl">سنوات الخبرة</div><div class="dv">${c.years} سنوات</div></div>
      <div class="detail-item"><div class="dl">المدينة</div><div class="dv">${esc(c.city)}</div></div>
      <div class="detail-item"><div class="dl">الجنسية</div><div class="dv">${esc(c.nationality)}</div></div>
      <div class="detail-item"><div class="dl">المصدر</div><div class="dv">${srcTag(c.source)}</div></div>
      <div class="detail-item"><div class="dl">الجوال</div><div class="dv" style="direction:ltr; text-align:end">${esc(c.phone)}</div></div>
      <div class="detail-item"><div class="dl">الإيميل</div><div class="dv" style="direction:ltr; text-align:end">${esc(c.email)}</div></div>
      <div class="detail-item"><div class="dl">الشاغر المرتبط</div><div class="dv">${vacName(c.vacancyId) ? esc(vacName(c.vacancyId)) : "—"}</div></div>
      <div class="detail-item"><div class="dl">تاريخ الإضافة</div><div class="dv">${fmtDateFull(c.date)}</div></div>
    </div>
    <div class="dl" style="font-size:10.5px; color:var(--muted); margin-bottom:4px">ملاحظات الفرز</div>
    <div class="notes-box">${esc(c.notes || "لا توجد ملاحظات")}</div>
    <div class="modal-note">✏️ للتعديل اطلب مني في المحادثة، مثال: «انقل ${esc(c.name)} لمرحلة ${curIdx < 4 && !c.rejected ? esc(DB.stages[curIdx+1] || "التعيين") : "المقابلة"}» أو «عدّل تقييم ${esc(c.name)} إلى 5»</div>`;
  $("#overlay").classList.add("open");
  $("#mClose").onclick = closeModal;
}
function closeModal(){ $("#overlay").classList.remove("open"); }
$("#overlay").addEventListener("click", e => { if(e.target === $("#overlay")) closeModal(); });
document.addEventListener("keydown", e => { if(e.key === "Escape") closeModal(); });

/* ---------- تلميحات (Tooltip) ---------- */
const tip = $("#tooltip");
document.addEventListener("mouseover", e => {
  const el = e.target.closest("[data-tip]");
  if(!el){ tip.style.display = "none"; return; }
  tip.textContent = el.dataset.tip;
  tip.style.display = "block";
});
document.addEventListener("mousemove", e => {
  if(tip.style.display !== "block") return;
  const pad = 12, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX - w - pad; /* في RTL نفضّل يسار المؤشر */
  if(x < 8) x = e.clientX + pad;
  let y = e.clientY - h - pad;
  if(y < 8) y = e.clientY + pad;
  tip.style.left = Math.min(x, window.innerWidth - w - 8) + "px";
  tip.style.top = Math.min(y, window.innerHeight - h - 8) + "px";
});

/* ---------- تشغيل ---------- */

/* ---------- فك التشفير والدخول ---------- */
async function farzDecrypt(pass){
  const te = new TextEncoder();
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const mat = await crypto.subtle.importKey("raw", te.encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name:"PBKDF2", salt:b64(FARZ_ENC.salt), iterations:FARZ_ENC.iter, hash:"SHA-256" },
    mat, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(FARZ_ENC.iv) }, key, b64(FARZ_ENC.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function initGate(){
  const btn = document.getElementById("gateBtn");
  const inp = document.getElementById("gatePass");
  const err = document.getElementById("gateErr");
  async function tryUnlock(){
    const v = inp.value.trim();
    if(!v) return;
    btn.disabled = true; btn.textContent = "جاري التحقق…"; err.textContent = "";
    try{
      DB = await farzDecrypt(v);
      document.body.classList.remove("locked");
      go("dashboard");
    }catch(e){
      err.textContent = "كلمة المرور غير صحيحة";
      btn.disabled = false; btn.textContent = "دخول";
      inp.select();
    }
  }
  btn.onclick = tryUnlock;
  inp.addEventListener("keydown", e => { if(e.key === "Enter") tryUnlock(); });
  inp.focus();
}
initGate();
