<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>صلة فرز — منصة بسام لإدارة التوظيف</title>
<style>
/* ============================================================
   صلة فرز — Silat Farz Recruitment Platform
   Light/dark theme via CSS custom properties (validated palette)
   ============================================================ */
:root{
  color-scheme: light;
  --bg:#f9f9f7; --surface:#fcfcfb; --surface-2:#f3f2ee;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,.10);
  --accent:#b8233f; --accent-ink:#7d1029; --accent-soft:rgba(184,35,63,.09);
  --s1:#b8233f; --s2:#eb6834; --s3:#1baf7a; --s-other:#a5a49d;
  --good:#0ca30c; --good-text:#006300; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --ord1:#ef869a; --ord2:#e75570; --ord3:#d62a4a; --ord4:#ab1c37; --ord5:#6b0d1f;
  --shadow:0 1px 2px rgba(11,11,11,.04), 0 4px 16px rgba(11,11,11,.05);
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --bg:#0d0d0d; --surface:#1a1a19; --surface-2:#232322;
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
    --accent:#e14d68; --accent-ink:#f5a3b3; --accent-soft:rgba(225,77,104,.14);
    --s1:#e14d68; --s2:#d95926; --s3:#199e70; --s-other:#6d6c66;
    --good:#0ca30c; --good-text:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
    --ord1:#f6b7c3; --ord2:#ef869a; --ord3:#e75570; --ord4:#bf2542; --ord5:#95182f;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0d0d0d; --surface:#1a1a19; --surface-2:#232322;
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
  --accent:#e14d68; --accent-ink:#f5a3b3; --accent-soft:rgba(225,77,104,.14);
  --s1:#e14d68; --s2:#d95926; --s3:#199e70; --s-other:#6d6c66;
  --good:#0ca30c; --good-text:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --ord1:#f6b7c3; --ord2:#ef869a; --ord3:#e75570; --ord4:#bf2542; --ord5:#95182f;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit; cursor:pointer}
input,select{font-family:inherit}

/* ---------- Layout ---------- */
.app{display:flex; min-height:100vh}
.sidebar{
  width:225px; flex-shrink:0; background:var(--surface);
  border-inline-start:none; border-inline-end:1px solid var(--border);
  padding:16px 12px; position:sticky; top:0; height:100vh; overflow-y:auto;
  display:flex; flex-direction:column; gap:2px;
}
.brand{display:flex; align-items:center; gap:10px; padding:6px 8px 16px}
.brand-logo{
  width:38px; height:38px; border-radius:10px; background:var(--accent);
  color:#fff; display:flex; align-items:center; justify-content:center;
  font-size:19px; font-weight:800; flex-shrink:0;
}
.brand-name{font-size:17px; font-weight:800; letter-spacing:-.2px}
.brand-sub{font-size:10.5px; color:var(--muted); margin-top:-3px}
.nav-label{font-size:10.5px; color:var(--muted); padding:12px 10px 4px; font-weight:700}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:9px;
  color:var(--ink-2); background:none; border:none; width:100%; text-align:start;
  font-size:13.5px; transition:background .12s;
}
.nav-item svg{width:17px; height:17px; flex-shrink:0; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.nav-item:hover{background:var(--surface-2)}
.nav-item.active{background:var(--accent-soft); color:var(--accent-ink); font-weight:700}
.nav-count{
  margin-inline-start:auto; font-size:11px; background:var(--surface-2);
  color:var(--muted); border-radius:20px; padding:0 7px; min-width:20px; text-align:center;
  font-variant-numeric:tabular-nums;
}
.nav-item.active .nav-count{background:var(--accent); color:#fff}
.sidebar-foot{margin-top:auto; padding:12px 8px 4px; border-top:1px solid var(--border)}
.user-chip{display:flex; align-items:center; gap:9px}
.user-avatar{
  width:32px; height:32px; border-radius:50%; background:var(--accent-soft);
  color:var(--accent-ink); font-weight:800; font-size:13px;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.user-name{font-size:12.5px; font-weight:700}
.user-role{font-size:10.5px; color:var(--muted)}

.main{flex:1; min-width:0; display:flex; flex-direction:column}
.topbar{
  display:flex; align-items:center; gap:10px; padding:12px 20px;
  border-bottom:1px solid var(--border); background:var(--surface);
  position:sticky; top:0; z-index:40;
}
.page-title{font-size:16px; font-weight:800; margin-inline-end:auto}
.chip{
  display:inline-flex; align-items:center; gap:6px; font-size:11.5px;
  border:1px solid var(--border); border-radius:20px; padding:3px 10px;
  color:var(--ink-2); background:var(--surface); white-space:nowrap;
}
.dot{width:7px; height:7px; border-radius:50%; flex-shrink:0}
.dot.off{background:var(--muted)} .dot.on{background:var(--good)} .dot.wait{background:var(--warn)}
.icon-btn{
  width:32px; height:32px; border-radius:9px; border:1px solid var(--border);
  background:var(--surface); color:var(--ink-2); display:flex; align-items:center;
  justify-content:center; font-size:15px;
}
.icon-btn:hover{background:var(--surface-2)}
.content{padding:20px; max-width:1200px; width:100%; margin:0 auto}

/* ---------- Cards & general ---------- */
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
  box-shadow:var(--shadow); padding:16px;
}
.card-title{font-size:13px; font-weight:800; margin-bottom:12px; display:flex; align-items:center; gap:8px}
.card-title .hint{font-weight:400; font-size:11px; color:var(--muted); margin-inline-start:auto}
.grid{display:grid; gap:14px}
.grid-2{grid-template-columns:1fr 1fr}
@media (max-width:860px){ .grid-2{grid-template-columns:1fr} }
.section-gap{margin-bottom:14px}

/* ---------- Demo banner ---------- */
.banner{
  display:flex; align-items:center; gap:10px; background:var(--accent-soft);
  border:1px solid var(--border); border-radius:var(--r); padding:10px 14px;
  font-size:12.5px; color:var(--ink-2); margin-bottom:14px;
}
.banner b{color:var(--accent-ink)}
.banner .close{margin-inline-start:auto; background:none; border:none; color:var(--muted); font-size:16px; padding:2px 6px}

/* ---------- Stat tiles ---------- */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:14px}
.stat{background:var(--surface); border:1px solid var(--border); border-radius:var(--r); box-shadow:var(--shadow); padding:14px 16px}
.stat-label{font-size:11.5px; color:var(--muted); margin-bottom:4px}
.stat-value{font-size:26px; font-weight:700; line-height:1.15}
.stat-delta{font-size:11px; margin-top:3px; color:var(--muted)}
.stat-delta.up{color:var(--good-text); font-weight:700}

/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto}
table{width:100%; border-collapse:collapse; font-size:13px}
th{
  text-align:start; font-size:11px; color:var(--muted); font-weight:700;
  padding:8px 10px; border-bottom:1px solid var(--grid); white-space:nowrap;
}
td{padding:9px 10px; border-bottom:1px solid var(--grid); white-space:nowrap; vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer; transition:background .1s}
tbody tr:hover{background:var(--surface-2)}
.td-name{font-weight:700}
.td-sub{font-size:11px; color:var(--muted); font-weight:400}
.num{font-variant-numeric:tabular-nums}

/* ---------- Badges ---------- */
.badge{
  display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700;
  border-radius:20px; padding:2px 9px; white-space:nowrap;
}
.badge .dot{width:6px; height:6px}
.b-stage1{background:var(--accent-soft); color:var(--accent-ink)}
.b-neutral{background:var(--surface-2); color:var(--ink-2)}
.b-good{background:rgba(12,163,12,.12); color:var(--good-text)}
.b-crit{background:rgba(208,59,59,.12); color:var(--crit)}
.b-warn{background:rgba(250,178,25,.15); color:var(--ink-2)}
.stars{color:var(--warn); font-size:12px; letter-spacing:1px; white-space:nowrap}
.stars .off{color:var(--grid)}
.src-tag{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ink-2)}
.src-tag .sq{width:8px; height:8px; border-radius:2px; flex-shrink:0}

/* ---------- Toolbar / filters ---------- */
.toolbar{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px}
.search{
  flex:1; min-width:180px; display:flex; align-items:center; gap:8px;
  background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:7px 12px;
}
.search input{border:none; outline:none; background:none; color:var(--ink); width:100%; font-size:13px}
.search svg{width:15px; height:15px; stroke:var(--muted); fill:none; stroke-width:2; stroke-linecap:round; flex-shrink:0}
.select{
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:7px 10px; font-size:12.5px; color:var(--ink-2); outline:none; max-width:170px;
}
.result-count{font-size:11.5px; color:var(--muted); margin-top:10px}

/* ---------- Candidate cards ---------- */
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px}
.cand-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
  box-shadow:var(--shadow); padding:14px; cursor:pointer; transition:border-color .12s;
}
.cand-card:hover{border-color:var(--accent)}
.cand-head{display:flex; align-items:center; gap:10px; margin-bottom:9px}
.cand-avatar{
  width:36px; height:36px; border-radius:50%; flex-shrink:0;
  background:var(--accent-soft); color:var(--accent-ink);
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px;
}
.cand-name{font-weight:800; font-size:13.5px}
.cand-title{font-size:11.5px; color:var(--muted)}
.cand-meta{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.cand-foot{display:flex; align-items:center; justify-content:space-between; margin-top:10px; padding-top:9px; border-top:1px solid var(--grid)}

/* ---------- Kanban ---------- */
.kanban{display:flex; gap:12px; overflow-x:auto; padding-bottom:8px}
.kcol{min-width:200px; width:200px; flex-shrink:0}
.kcol-head{
  display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:800;
  padding:8px 10px; background:var(--surface); border:1px solid var(--border);
  border-radius:10px; margin-bottom:8px;
}
.kcol-count{margin-inline-start:auto; font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums}
.kcard{
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:10px 12px; margin-bottom:8px; cursor:pointer; box-shadow:var(--shadow);
}
.kcard:hover{border-color:var(--accent)}
.kcard-name{font-weight:700; font-size:12.5px}
.kcard-sub{font-size:11px; color:var(--muted); margin-top:2px}
.kempty{font-size:11.5px; color:var(--muted); text-align:center; padding:14px 8px; border:1px dashed var(--grid); border-radius:10px}

/* ---------- Tasks ---------- */
.task-day{font-size:11.5px; font-weight:800; color:var(--muted); margin:14px 0 8px}
.task-day:first-child{margin-top:0}
.task-row{
  display:flex; align-items:center; gap:12px; background:var(--surface);
  border:1px solid var(--border); border-radius:10px; padding:10px 14px; margin-bottom:8px;
}
.task-check{
  width:19px; height:19px; border-radius:6px; border:1.5px solid var(--baseline);
  background:none; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  color:transparent; font-size:12px;
}
.task-row.done .task-check{background:var(--good); border-color:var(--good); color:#fff}
.task-row.done .task-title{text-decoration:line-through; color:var(--muted)}
.task-title{font-weight:700; font-size:13px}
.task-sub{font-size:11px; color:var(--muted)}
.task-time{margin-inline-start:auto; font-size:12px; color:var(--ink-2); font-variant-numeric:tabular-nums; white-space:nowrap}

/* ---------- Charts (div-based bars) ---------- */
.bar-row{display:flex; align-items:center; gap:10px; min-height:26px}
.bar-label{width:110px; flex-shrink:0; font-size:11.5px; color:var(--ink-2); text-align:start; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bar-track{flex:1; display:flex; align-items:center; gap:7px}
.bar-fill{height:16px; border-radius:0 4px 4px 0; min-width:3px; transition:width .3s}
[dir="rtl"] .bar-fill{border-radius:4px 0 0 4px}
.bar-val{font-size:11.5px; color:var(--ink-2); font-variant-numeric:tabular-nums}
.stack{display:flex; gap:2px; height:18px; border-radius:5px; overflow:hidden; margin:6px 0 12px}
.stack-seg{height:100%; min-width:4px}
.legend{display:flex; flex-wrap:wrap; gap:12px; font-size:11.5px; color:var(--ink-2)}
.legend .key{display:flex; align-items:center; gap:6px}
.legend .sw{width:9px; height:9px; border-radius:2.5px; flex-shrink:0}
.legend b{font-variant-numeric:tabular-nums}
.chart-note{font-size:10.5px; color:var(--muted); margin-top:10px}

/* ---------- Empty states ---------- */
.empty{
  text-align:center; padding:36px 20px; color:var(--muted);
  border:1.5px dashed var(--grid); border-radius:var(--r); font-size:13px;
}
.empty .big{font-size:26px; margin-bottom:8px}
.empty b{color:var(--ink-2)}

/* ---------- Settings ---------- */
.conn-card{display:flex; align-items:flex-start; gap:12px; padding:14px 0; border-bottom:1px solid var(--grid)}
.conn-card:last-child{border-bottom:none}
.conn-icon{
  width:38px; height:38px; border-radius:10px; background:var(--surface-2);
  display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0;
}
.conn-name{font-weight:800; font-size:13px}
.conn-desc{font-size:11.5px; color:var(--muted); margin-top:2px; line-height:1.55}
.cmd{
  display:block; width:100%; text-align:start; background:var(--surface-2); border:1px solid var(--border);
  border-radius:9px; padding:8px 12px; font-size:12.5px; color:var(--ink-2); margin-bottom:7px;
}
.cmd:hover{border-color:var(--accent); color:var(--accent-ink)}
.cmd b{color:var(--accent-ink)}

/* ---------- Modal ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:100;
  display:none; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto;
}
.overlay.open{display:flex}
.modal{
  background:var(--surface); border:1px solid var(--border); border-radius:16px;
  width:100%; max-width:520px; padding:22px; box-shadow:0 20px 60px rgba(0,0,0,.3);
}
.modal-head{display:flex; align-items:center; gap:12px; margin-bottom:14px}
.modal-close{margin-inline-start:auto; background:none; border:none; font-size:20px; color:var(--muted); padding:4px 8px}
.detail-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; margin:14px 0}
@media (max-width:480px){ .detail-grid{grid-template-columns:1fr} }
.detail-item .dl{font-size:10.5px; color:var(--muted)}
.detail-item .dv{font-size:13px; font-weight:600; word-break:break-word}
.timeline{display:flex; align-items:center; gap:0; margin:16px 0 6px}
.tl-step{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; position:relative}
.tl-dot{width:13px; height:13px; border-radius:50%; background:var(--grid); border:2px solid var(--surface); z-index:2}
.tl-step.on .tl-dot{background:var(--accent)}
.tl-step.cur .tl-dot{box-shadow:0 0 0 3px var(--accent-soft)}
.tl-line{position:absolute; top:6px; inset-inline-start:-50%; width:100%; height:2px; background:var(--grid); z-index:1}
.tl-step.on .tl-line{background:var(--accent)}
.tl-step:first-child .tl-line{display:none}
.tl-name{font-size:9.5px; color:var(--muted); text-align:center}
.tl-step.cur .tl-name{color:var(--accent-ink); font-weight:800}
.modal-note{
  background:var(--accent-soft); border-radius:10px; padding:10px 13px;
  font-size:11.5px; color:var(--ink-2); margin-top:14px; line-height:1.6;
}
.notes-box{background:var(--surface-2); border-radius:10px; padding:10px 13px; font-size:12.5px; color:var(--ink-2); line-height:1.7}

/* ---------- Tooltip ---------- */
#tooltip{
  position:fixed; z-index:200; background:var(--ink); color:var(--bg);
  font-size:11.5px; padding:6px 10px; border-radius:8px; pointer-events:none;
  display:none; max-width:220px; box-shadow:0 4px 14px rgba(0,0,0,.25);
}
#tooltip b{font-variant-numeric:tabular-nums}

/* ---------- Responsive: narrow panel ---------- */
@media (max-width:820px){
  .app{flex-direction:column}
  .sidebar{
    width:100%; height:auto; position:static; flex-direction:row; align-items:center;
    overflow-x:auto; padding:8px 10px; gap:4px; border-inline-end:none;
    border-bottom:1px solid var(--border);
  }
  .brand{padding:0 4px; margin-inline-end:6px}
  .brand-sub, .nav-label, .sidebar-foot{display:none}
  .nav-item{width:auto; white-space:nowrap; padding:7px 11px; font-size:12.5px}
  .nav-item svg{width:15px; height:15px}
  .content{padding:14px}
  .topbar{padding:10px 14px; flex-wrap:wrap}
}
::-webkit-scrollbar{height:8px; width:8px}
::-webkit-scrollbar-thumb{background:var(--baseline); border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* عرض المزيد — للقوائم الكبيرة */
.btn-more{display:block; width:100%; margin:10px 0 4px; padding:11px; border:1.5px dashed var(--border); border-radius:11px; background:var(--bg); color:var(--accent); font-size:13px; font-weight:800; cursor:pointer; font-family:inherit}
.btn-more:hover{border-color:var(--accent)}
.btn-more span{color:var(--muted); font-weight:600; font-size:11.5px}
.kmore{padding:9px; text-align:center; font-size:11px; color:var(--muted); background:var(--bg); border:1px dashed var(--border); border-radius:9px; margin-top:6px}

/* زر استبعاد/إرجاع مباشر */
.row-del{
  width:26px; height:26px; flex-shrink:0; border-radius:8px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--muted); font-size:13px; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; font-family:inherit;
}
.row-del:hover{border-color:var(--crit); color:var(--crit)}

/* شواغر — قائمة المرشحين المرتبطين وزر الاختيار */
.vac-cands{margin-top:10px; display:flex; flex-direction:column; gap:6px}
.vac-cand-row{display:flex; align-items:center; gap:8px; padding:6px 8px; background:var(--surface-2); border-radius:9px; cursor:pointer}
.vac-cand-row:hover{background:var(--accent-soft)}
.pick-btn{
  flex-shrink:0; font-size:10.5px; font-weight:700; padding:4px 9px; border-radius:20px; cursor:pointer;
  border:1px solid var(--border); background:var(--surface); color:var(--muted); font-family:inherit;
}
.pick-btn:hover{border-color:var(--warn)}
.pick-btn.on{background:var(--warn); border-color:var(--warn); color:#fff}

/* نسخ سريع للجوال/الإيميل داخل نافذة التفاصيل */
.cp-mini{background:none; border:1px solid transparent; border-radius:6px; padding:2px 5px; font:inherit; font-size:13px; font-weight:600; color:var(--ink); cursor:pointer; word-break:break-all}
.cp-mini:hover{background:var(--surface-2); border-color:var(--border)}

/* رابط فتح الرسالة الأصلية في Gmail */
.btn-gmail{
  display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
  margin:14px 0 2px; padding:11px; border-radius:11px; border:1.5px solid var(--accent);

async function uploadCandidateCv(candidateId, file){
  const safeName = file.name.replace(/[^\w.\-]+/g, "_");
  const path = `${candidateId}/${Date.now()}_${safeName}`;
  const { error: upErr } = await sb.storage.from("cv-files").upload(path, file, { upsert: true });
  if(upErr) throw new Error(upErr.message || "تعذّر رفع الملف");
  const { error: dbErr } = await sb.from("candidates").update({ cv_file_path: path }).eq("id", Number(candidateId));
  if(dbErr) throw new Error(dbErr.message || "تعذّر حفظ رابط الملف");
  return path;
}

  return data.signedUrl;
}
function mapVacancy(row){
  return {
    id: String(row.id),
    title: row.title,
    client: row.client,
    city: row.city,
    count: row.headcount,
    status: row.status,
    opened: row.opened_date || (row.created_at ? row.created_at.slice(0,10) : TODAY.toISOString().slice(0,10)),
    notes: row.notes
  };
}
async function fetchProfile(user){
  const { data, error } = await sb.from('profiles').select('full_name, email, role').eq('id', user.id).single();
  if(error){ console.warn('profile fetch failed:', error.message); return null; }
  return data;
}
async function fetchAllRows(table, selectCols){
  // Supabase/PostgREST يرجّع 1000 صف كحد أقصى لكل طلب — نسحب على دفعات لين نجيب كل الصفوف
  const PAGE = 1000;
  let all = [];
  let from = 0;
  while(true){
    const { data, error } = await sb.from(table).select(selectCols || '*').range(from, from + PAGE - 1);
    if(error) throw new Error(error.message || ("تعذّرت قراءة جدول " + table));
    if(!data || data.length === 0) break;
    all = all.concat(data);
    if(data.length < PAGE) break;
    from += PAGE;
  }
  return all;
}
async function loadLiveData(profile, authUser){
  const [cands, vacs, profs] = await Promise.all([
    fetchAllRows('candidates'),
    fetchAllRows('vacancies'),
    fetchAllRows('profiles', 'id, email, full_name, role')
  ]);
  DB = Object.assign({}, FARZ_SEED, {
    candidates: cands.map(mapCandidate),
    vacancies: vacs.map(mapVacancy),
    profiles: profs
  });
  DB.meta = Object.assign({}, FARZ_SEED.meta, {
    owner: (profile && profile.full_name) || authUser.email,
    role: (profile && profile.role === "admin") ? "مدير" : "عضو فريق",
    lastUpdate: new Date().toISOString().slice(0,10),
    currentUserId: authUser.id
  });
}
function translateAuthError(err){
  const m = (err && err.message) || "";
  if (m.includes("Invalid login credentials")) return "البريد الإلكتروني أو كلمة المرور غير صحيحة.";
  if (m.includes("Email not confirmed")) return "هذا الحساب لم يُفعّل بعد — تواصل مع بسام لتفعيله.";
  if (m.includes("Failed to fetch")) return "تعذر الاتصال بالخادم — تأكد من اتصالك بالإنترنت.";
  return "صار خطأ: " + m;
}
async function bootApp(user){
  const err = document.getElementById("gateErr");
  try{
    const profile = await fetchProfile(user);
    await loadLiveData(profile, user);
    document.body.classList.remove("locked");
    CURRENT = "dashboard";
    go("dashboard");
  }catch(e){
    document.body.classList.add("locked");
    if(err) err.textContent = "تعذّر تحميل البيانات: " + e.message;
  }
}
async function doLogout(){
  await sb.auth.signOut();
  DB = null;
  document.body.classList.add("locked");
  const f = document.getElementById("gateForm"); if(f) f.reset();
  const err = document.getElementById("gateErr"); if(err) err.textContent = "";
}
document.getElementById("gateForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("gateBtn");
  const err = document.getElementById("gateErr");
  err.textContent = "";
  btn.disabled = true; btn.textContent = "جاري التحقق…";
  const email = document.getElementById("gateEmail").value.trim();
  const password = document.getElementById("gatePass").value;
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = "دخول";
  if(error){ err.textContent = translateAuthError(error); return; }
  await bootApp(data.user);
});

let themeMode = "auto";
function toggleTheme(){
  themeMode = themeMode === "auto" ? "dark" : themeMode === "dark" ? "light" : "auto";
  const root = document.documentElement;
  if(themeMode === "auto") root.removeAttribute("data-theme");
  else root.setAttribute("data-theme", themeMode);
}

function statTile(label, value, delta, deltaUp){
  return `<div class="stat"><div class="stat-label">${label}</div><div class="stat-value">${value}</div>${delta ? `<div class="stat-delta ${deltaUp ? "up" : ""}">${delta}</div>` : ""}</div>`;

function funnelBars(){
  const counts = DB.stages.map(s => activeCands().filter(c => c.stage === s).length);
  const max = Math.max(...counts, 1);
  const ords = ["var(--ord1)","var(--ord2)","var(--ord3)","var(--ord4)","var(--ord5)"];
  let h = "";
  DB.stages.forEach((s, i) => {
    const pct = Math.max(counts[i] / max * 100, 2);
    h += `<div class="bar-row" data-tip="مرحلة ${esc(s)}: ${counts[i]} مرشح">
      <div class="bar-label">${esc(s)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${ords[i]}"></div><span class="bar-val">${counts[i]}</span></div>
    </div>`;
  });
  const rej = DB.candidates.filter(c => c.rejected).length;
  h += `<div class="chart-note">✕ مرفوض: <b>${rej}</b> — خارج المسار، محفوظ في بنك السير.</div>`;
  return h;
}

/* ---------- عرض تدريجي للقوائم الكبيرة (مهم للجوال مع آلاف السير) ---------- */
let SHOWN = {};
function pagedList(list, key, per, fn){
  const n = Math.min(SHOWN[key] || per, list.length);
  const rest = list.length - n;
  return {
    html: list.slice(0, n).map(fn).join(""),
    shown: n,
    btn: rest > 0 ? `<button class="btn-more" data-more="${key}" data-per="${per}">عرض المزيد ⌄&nbsp;<span>(${rest.toLocaleString("en-US")} متبقية)</span></button>` : ""
  };
}

/* ---------- الفلترة ---------- */
function filterCands(){
  const nq = normAr(filters.q);
  return DB.candidates.filter(c => {
    if(nq){
      const hay = normAr([c.name || "", c.title, c.specialty, c.city, c.notes, c.email, c.source, c.phone || ""].join(" "));
      if(!hay.includes(nq)) return false;
    }
    if(filters.specialty && c.specialty !== filters.specialty) return false;
    if(filters.city && c.city !== filters.city) return false;
    if(filters.exp){
      const y = c.years;
      if(filters.exp === "none"){ if(y !== null && y !== undefined) return false; }
      else if(y === null || y === undefined) return false;
      else if(filters.exp === "0-3" && !(y >= 0 && y <= 3)) return false;
      else if(filters.exp === "4-6" && !(y >= 4 && y <= 6)) return false;
      else if(filters.exp === "7-10" && !(y >= 7 && y <= 10)) return false;
      else if(filters.exp === "10+" && !(y > 10)) return false;
    }
    if(filters.source && c.source !== filters.source) return false;
    if(filters.stage === "مرفوض"){ if(!c.rejected) return false; }
    else if(filters.stage){ if(c.rejected || c.stage !== filters.stage) return false; }
    return true;
  }).sort((a,b) => b.date.localeCompare(a.date));
}

/* ---------- ربط الأحداث بعد كل عرض ---------- */
function bindView(){
  document.querySelectorAll("[data-more]").forEach(el => el.onclick = () => {
    const k = el.dataset.more;
    SHOWN[k] = (SHOWN[k] || parseInt(el.dataset.per, 10)) + 500;
    go(CURRENT, true);
  });
  document.querySelectorAll("[data-cand]").forEach(el => el.onclick = () => openModal(el.dataset.cand));
  document.querySelectorAll("[data-exclude]").forEach(el => el.onclick = e => {
    e.stopPropagation();
    const c = DB.candidates.find(x => x.id === el.dataset.exclude);
    if(!c) return;
    c.rejected = !c.rejected;
    go(CURRENT, true);
    sb.from("candidates").update({ rejected: c.rejected }).eq("id", Number(c.id)).then(({error}) => {
      if(error){ console.error("reject toggle failed:", error.message); c.rejected = !c.rejected; go(CURRENT, true); }
    });
  });
  document.querySelectorAll("[data-pick]").forEach(el => el.onclick = e => {
    e.stopPropagation();
    const c = DB.candidates.find(x => x.id === el.dataset.pick);
    const vacId = el.dataset.vac;
    if(!c) return;
    const prev = c.pickedFor;
    c.pickedFor = (c.pickedFor === vacId) ? null : vacId;
    go(CURRENT, true);
    sb.from("candidates").update({ picked_for: c.pickedFor ? Number(c.pickedFor) : null }).eq("id", Number(c.id)).then(({error}) => {
      if(error){ console.error("pick toggle failed:", error.message); c.pickedFor = prev; go(CURRENT, true); }
    });
  });
  document.querySelectorAll("[data-close-banner]").forEach(el => el.onclick = e => { e.stopPropagation(); bannerHidden = true; go(CURRENT); });
  document.querySelectorAll("[data-toggle-role]").forEach(el => el.onclick = e => {
    e.stopPropagation();
    const id = el.dataset.toggleRole;
    const newRole = el.dataset.newRole;
    const p = (DB.profiles || []).find(x => x.id === id);
    if(!p) return;
    const prevRole = p.role;
    p.role = newRole;
    go(CURRENT, true);
    sb.from("profiles").update({ role: newRole }).eq("id", id).then(({error}) => {
      if(error){ console.error("role toggle failed:", error.message); p.role = prevRole; go(CURRENT, true); }
    });
  });
  document.querySelectorAll("[data-delete-member]").forEach(el => el.onclick = async e => {
    e.stopPropagation();
    const id = el.dataset.deleteMember;
    const name = el.dataset.name;
    if(!confirm(`متأكد تبي تحذف ${name}؟ ما يتراجع الإجراء.`)) return;
    el.disabled = true;
    const { data, error } = await sb.functions.invoke("swift-handler", { body: { action: "delete", user_id: id } });
    el.disabled = false;
    if(error || (data && data.error)){
      alert("تعذّر الحذف: " + ((data && data.error) || (error && error.message) || "خطأ غير معروف"));
      return;
    }
    DB.profiles = (DB.profiles || []).filter(x => x.id !== id);
    go(CURRENT, true);
  });
  const addMemberForm = $("#addMemberForm");
  if(addMemberForm){
    addMemberForm.addEventListener("submit", async e => {
      e.preventDefault();
      const err = $("#addMemberErr");
      err.textContent = "";
      const full_name = $("#nmFullName").value.trim();
      const email = $("#nmEmail").value.trim();
      const password = $("#nmPassword").value;
      const role = $("#nmRole").value;
      const btn = addMemberForm.querySelector("button[type=submit]");
      btn.disabled = true; btn.textContent = "جاري الإضافة…";
      const { data, error } = await sb.functions.invoke("swift-handler", { body: { action: "create", email, password, full_name, role } });
      btn.disabled = false; btn.textContent = "إضافة";
      if(error || (data && data.error)){
        err.textContent = "تعذّرت الإضافة: " + ((data && data.error) || (error && error.message) || "خطأ غير معروف");
        return;
      }
      DB.profiles = DB.profiles || [];
      DB.profiles.push({ id: data.id, email, full_name, role });
      go(CURRENT, true);
    });
  }
  document.querySelectorAll("[data-task]").forEach(el => el.onclick = () => {
    const t = DB.tasks.find(t => t.id === el.dataset.task);
    if(t){ t.done = !t.done; go(CURRENT); }
  });
  function legacyCopy(txt){
    try{
      const ta = document.createElement("textarea");
      ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    }catch(e){ return false; }
  }
  document.querySelectorAll("[data-copy]").forEach(el => el.onclick = () => {
    const txt = el.dataset.copy;
    const flash = ok => { el.style.borderColor = ok ? "var(--good)" : "var(--crit)"; setTimeout(() => el.style.borderColor = "", 900); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(() => flash(true)).catch(() => flash(legacyCopy(txt)));
    } else {
      flash(legacyCopy(txt));
    }
  });
  const q = $("#q");
  if(q){
    q.oninput = () => { filters.q = q.value; refreshTableOnly(); };
    const fS = $("#fSpec"), fR = $("#fSrc"), fG = $("#fStage"), fC = $("#fCity"), fE = $("#fExp");
    fS.onchange = () => { filters.specialty = fS.value; go(CURRENT); };
    fR.onchange = () => { filters.source = fR.value; go(CURRENT); };
    fG.onchange = () => { filters.stage = fG.value; go(CURRENT); };
    if(fC) fC.onchange = () => { filters.city = fC.value; go(CURRENT); };
    if(fE) fE.onchange = () => { filters.exp = fE.value; go(CURRENT); };
  }
}
function refreshTableOnly(){
  /* إعادة رسم مع الحفاظ على تركيز البحث */
  const pos = $("#q").selectionStart;
  go(CURRENT);
  const q = $("#q");
  if(q){ q.focus(); q.setSelectionRange(pos, pos); }
}

/* ---------- نافذة تفاصيل المرشح ---------- */
function openModal(id){
  const c = DB.candidates.find(x => x.id === id);
  if(!c) return;
  const curIdx = DB.stages.indexOf(c.stage);
  const timeline = c.rejected
    ? `<div class="modal-note" style="background:rgba(208,59,59,.1); color:var(--crit)">✕ هذا المرشح مرفوض — محفوظ في بنك السير لفرص مستقبلية. للاسترجاع قل: «رجّع ${esc(dn(c))} للمسار»</div>`
    : `<div class="timeline">${DB.stages.map((s, i) => `
        <div class="tl-step ${i <= curIdx ? "on" : ""} ${i === curIdx ? "cur" : ""}">
          <div class="tl-line"></div><div class="tl-dot"></div><div class="tl-name">${s}</div>
        </div>`).join("")}</div>`;
  $("#modal").innerHTML = `
    <div class="modal-head">
      <div class="cand-avatar" style="width:44px; height:44px; font-size:16px">${esc(initials(dn(c)))}</div>
      <div>
        <div style="font-weight:800; font-size:16px">${esc(dn(c))} ${c.shortlisted ? "⭐" : ""}</div>
        <div class="td-sub">${esc(c.title)}</div>
      </div>
      <button class="modal-close" id="mClose">✕</button>
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center">
      <span class="badge b-neutral">${esc(c.specialty)}</span>
      ${stageBadge(c)}
      ${stars(c.rating)}
    </div>
    ${timeline}
    <div class="detail-grid">
      <div class="detail-item"><div class="dl">سنوات الخبرة</div><div class="dv">${yrs(c)}</div></div>
      <div class="detail-item"><div class="dl">المدينة</div><div class="dv">${esc(c.city)}</div></div>
      <div class="detail-item"><div class="dl">الجنسية</div><div class="dv">${esc(c.nationality || "—")}</div></div>
      <div class="detail-item"><div class="dl">المصدر</div><div class="dv">${srcTag(c.source)}</div></div>
      <div class="detail-item"><div class="dl">الجوال</div><div class="dv" style="direction:ltr; text-align:end">${c.phone ? `<button class="cp-mini" data-copy="${esc(c.phone)}">${esc(c.phone)} 📋</button>` : "—"}</div></div>
      <div class="detail-item"><div class="dl">الإيميل</div><div class="dv" style="direction:ltr; text-align:end">${c.email ? `<button class="cp-mini" data-copy="${esc(c.email)}">${esc(c.email)} 📋</button>` : "—"}</div></div>
      <div class="detail-item"><div class="dl">الشاغر المرتبط</div><div class="dv">${vacName(c.vacancyId) ? esc(vacName(c.vacancyId)) : "—"}</div></div>
      <div class="detail-item"><div class="dl">تاريخ الإضافة</div><div class="dv">${fmtDateFull(c.date)}</div></div>
    </div>
    ${c.cvFilePath ? `
    <button class="btn-gmail" id="cvViewBtn" type="button">📄 عرض / تنزيل ملف السيرة</button>
    <label class="btn-gmail" for="cvUploadInput" style="margin-top:6px; opacity:.7; font-size:11px; padding:8px">🔄 استبدال الملف بنسخة جديدة</label>
    ` : `
    <label class="btn-gmail" for="cvUploadInput">📄 رفع ملف السيرة (PDF أو Word)</label>
    `}
    <input type="file" id="cvUploadInput" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" style="display:none">
    <div class="td-sub" id="cvUploadStatus" style="text-align:center; margin:2px 0 4px; min-height:14px"></div>
    ${gmailSearchLink(c) ? `<a href="${esc(gmailSearchLink(c))}" target="_blank" rel="noopener" style="display:block; text-align:center; font-size:10.5px; color:var(--muted); margin-bottom:8px">أو افتح الرسالة الأصلية في Gmail (يحتاج bajop369@gmail.com)</a>` : ""}
    <div class="dl" style="font-size:10.5px; color:var(--muted); margin-bottom:4px">ملاحظات الفرز</div>
    <div class="notes-box">${esc(c.notes || "لا توجد ملاحظات")}</div>
    <div class="modal-note">✏️ للتعديل اطلب مني في المحادثة، مثال: «انقل ${esc(dn(c))} لمرحلة ${curIdx < 4 && !c.rejected ? esc(DB.stages[curIdx+1] || "التعيين") : "المقابلة"}» أو «عدّل تقييم ${esc(dn(c))} إلى 5»</div>`;
  $("#overlay").classList.add("open");
  $("#mClose").onclick = closeModal;
  const cvViewBtn = $("#cvViewBtn");
  const cvInput = $("#cvUploadInput");
  const cvStatus = $("#cvUploadStatus");
  if(cvViewBtn) cvViewBtn.onclick = async () => {
    cvViewBtn.disabled = true; cvViewBtn.textContent = "جاري الفتح…";
    try{
      const url = await getCandidateCvUrl(c.cvFilePath);
      window.open(url, "_blank");
    }catch(e){
      if(cvStatus) cvStatus.textContent = "خطأ: " + e.message;
    }
    cvViewBtn.disabled = false; cvViewBtn.textContent = "📄 عرض / تنزيل ملف السيرة";
  };
  if(cvInput) cvInput.onchange = async () => {
    const file = cvInput.files[0];
    if(!file) return;
    if(file.size > 20 * 1024 * 1024){
      if(cvStatus) cvStatus.textContent = "الملف أكبر من 20 ميجا — اختر ملف أصغر";
      cvInput.value = "";
      return;
    }
    if(cvStatus) cvStatus.textContent = "جاري الرفع…";
    try{
      const path = await uploadCandidateCv(c.id, file);
      const dbC = DB.candidates.find(x => x.id === c.id);
      if(dbC) dbC.cvFilePath = path;
      openModal(c.id);
      go(CURRENT, true);
    }catch(e){
      if(cvStatus) cvStatus.textContent = "خطأ: " + e.message;
    }
  };
}
function closeModal(){ $("#overlay").classList.remove("open"); }
$("#overlay").addEventListener("click", e => { if(e.target === $("#overlay")) closeModal(); });
document.addEventListener("keydown", e => { if(e.key === "Escape") closeModal(); });

/* ---------- تلميحات (Tooltip) ---------- */
const tip = $("#tooltip");
document.addEventListener("mouseover", e => {
  const el = e.target.closest("[data-tip]");
  if(!el){ tip.style.display = "none"; return; }
  tip.textContent = el.dataset.tip;
  tip.style.display = "block";
});
document.addEventListener("mousemove", e => {
  if(tip.style.display !== "block") return;
  const pad = 12, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX - w - pad; /* في RTL نفضّل يسار المؤشر */
  if(x < 8) x = e.clientX + pad;
  let y = e.clientY - h - pad;
  if(y < 8) y = e.clientY + pad;
  tip.style.left = Math.min(x, window.innerWidth - w - 8) + "px";
  tip.style.top = Math.min(y, window.innerHeight - h - 8) + "px";
});

/* ---------- تشغيل ---------- */
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if(session && session.user){
    await bootApp(session.user);
  }
  /* لا يوجد جلسة — تبقى بوابة الدخول ظاهرة (body.locked من البداية) */
})();
</script>
